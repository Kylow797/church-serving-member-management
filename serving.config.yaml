# Church Serving configuration
# Edit this file to add/remove people, ministries and roles, then restart the server
# (or press "Reload config" in /admin). Never change a person's `id` once in use —
# rename via `name` instead. Removed entries are deactivated, not deleted, so history stays.
#
# rank: 1 = newcomer, 2 = regular, 3 = senior

settings:
  churchName: Grace Community Church
  timezone: Asia/Kuala_Lumpur
  adminCode: "1234"
  availability:
    openDaysBeforeMonthEnd: 7   # members submit during the last 7 days of the previous month
    alwaysOpen: false

ministries:
  - id: worship
    name: Worship Team
    seniority:
      minSenior: 1        # at least one rank-3 member every Saturday
      maxNewcomers: 3     # no more than three rank-1 members every Saturday
    roles:
      - { id: lead_singer, name: Lead Singer, min: 1, max: 1 }
      - { id: vocalist,    name: Vocalist,    min: 1, max: 2 }
      - { id: drummer,     name: Drummer,     min: 1, max: 1 }
      - { id: bassist,     name: Bassist,     min: 1, max: 1 }
      - { id: keyboardist, name: Keyboardist, min: 1, max: 1 }
      - { id: guitarist,   name: Guitarist,   min: 1, max: 1 }

  - id: ushering
    name: Ushering
    roles:
      - { id: usher, name: Usher, min: 2, max: 3 }

  - id: tech
    name: Tech
    roles:
      - { id: sound, name: Sound, min: 1, max: 1 }
      - { id: media, name: Media, min: 1, max: 1 }

